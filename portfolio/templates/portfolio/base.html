<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Дашборд инвестиций{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        :root {
            --bg: #f4f7fb;
            --surface: #ffffff;
            --surface-alt: #f8fafc;
            --panel: #ffffff;
            --line: #d9e2ec;
            --line-strong: #c5d0dd;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #2563eb;
            --accent-soft: #dbeafe;
            --success: #16a34a;
            --success-soft: #dcfce7;
            --warn: #d97706;
            --warn-soft: #fef3c7;
            --danger: #dc2626;
            --danger-soft: #fee2e2;
            --shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
            --shadow-soft: 0 2px 8px rgba(15, 23, 42, 0.04);
            --radius: 16px;
            --radius-sm: 12px;
        }
        * { box-sizing: border-box; }
        html { color-scheme: light; }
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.45;
        }
        .shell {
            max-width: 1520px;
            margin: 0 auto;
            padding: 24px 20px 32px;
        }
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }
        .hero h1 {
            margin: 0;
            font-size: clamp(1.8rem, 3vw, 2.6rem);
            font-weight: 800;
            letter-spacing: -0.035em;
        }
        .hero p {
            margin: 6px 0 0;
            color: var(--muted);
            max-width: 720px;
            font-size: 0.95rem;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 14px;
        }
        .card {
            grid-column: span 12;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
        }
        .card h2, .card h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1rem;
            letter-spacing: -0.02em;
        }
        .card--span-3 { grid-column: span 3; }
        .card--span-4 { grid-column: span 4; }
        .card--span-6 { grid-column: span 6; }
        .card--span-8 { grid-column: span 8; }
        .card--span-12 { grid-column: span 12; }
        .stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 112px;
            justify-content: space-between;
        }
        .stat .label {
            color: var(--muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }
        .stat .value {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }
        .performance-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            width: min(100%, 960px);
        }
        .performance-stat {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            background: var(--surface-alt);
            box-shadow: var(--shadow-soft);
        }
        .performance-stat .label {
            color: var(--muted);
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }
        .performance-stat .meta {
            color: var(--muted);
            font-size: 0.86rem;
        }
        .performance-stat .meta--method {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.74rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--accent);
        }
        .performance-stat .value {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text);
        }
        .value-line {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }
        .value-positive {
            color: var(--success) !important;
        }
        .value-negative {
            color: var(--danger) !important;
        }
        .value-neutral {
            color: var(--text);
        }
        .value-delta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0;
        }
        .forms-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }
        .action-button {
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text);
            padding: 12px 14px;
            text-align: left;
            font: inherit;
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            transition: border-color 120ms ease, box-shadow 120ms ease, background-color 120ms ease;
        }
        .action-button:hover,
        .action-button:focus-visible,
        .btn:hover,
        .btn:focus-visible,
        .form-control:focus,
        select:focus,
        textarea:focus,
        input:focus {
            outline: none;
            border-color: rgba(37, 99, 235, 0.45);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
        }
        .action-button--toolbar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: var(--surface);
            box-shadow: var(--shadow-soft);
        }
        .action-button--toolbar strong {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .action-button--toolbar span {
            display: none;
        }
        .toolbar-status {
            display: inline-flex;
            align-items: flex-start;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--line);
            box-shadow: var(--shadow-soft);
        }
        .toolbar-status strong {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }
        .toolbar-status span {
            display: block;
            color: var(--text);
            font-size: 0.88rem;
        }
        .action-button strong {
            display: block;
            font-size: 0.96rem;
            margin-bottom: 4px;
            font-weight: 700;
        }
        .action-button span {
            display: block;
            color: var(--muted);
            font-size: 0.84rem;
        }
        #modal-root {
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
        }
        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.32);
            backdrop-filter: blur(3px);
            pointer-events: auto;
        }
        .modal-shell {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            pointer-events: auto;
        }
        .modal-card {
            width: min(720px, 100%);
            max-height: calc(100vh - 48px);
            overflow: auto;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
            padding: 20px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 12px;
            margin-bottom: 14px;
        }
        .modal-close {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--line);
        }
        .form-errors {
            margin: 0 0 12px;
            padding: 12px 14px;
            border-radius: 12px;
            background: var(--danger-soft);
            color: var(--danger);
        }
        .form-errors ul {
            margin: 8px 0 0;
            padding-left: 18px;
        }
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        form { display: grid; gap: 10px; }
        label {
            display: grid;
            gap: 6px;
            font-size: 0.84rem;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.01em;
        }
        .form-control, select, textarea, input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            background: #fff;
            color: var(--text);
            font: inherit;
        }
        textarea { min-height: 88px; resize: vertical; }
        .btn {
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 9px 12px;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            line-height: 1.2;
            box-shadow: none;
            transition: background-color 120ms ease, border-color 120ms ease;
        }
        .btn--muted {
            background: #334155;
            color: #fff;
        }
        .btn--danger {
            background: var(--danger);
            color: #fff;
        }
        .btn--ghost {
            background: var(--surface);
            color: var(--text);
            border-color: var(--line);
        }
        .messages { display: grid; gap: 8px; margin-bottom: 14px; }
        .message {
            padding: 12px 14px;
            border-radius: 12px;
            background: var(--accent-soft);
            color: #1d4ed8;
            border: 1px solid rgba(37, 99, 235, 0.16);
        }
        .message.error {
            background: var(--danger-soft);
            color: var(--danger);
            border-color: rgba(220, 38, 38, 0.16);
        }
        .table-wrap {
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface);
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.9rem;
        }
        th, td {
            border-bottom: 1px solid var(--line);
            padding: 10px 12px;
            text-align: left;
            vertical-align: top;
        }
        thead th {
            position: sticky;
            top: 0;
            background: var(--surface-alt);
            color: var(--muted);
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            z-index: 1;
        }
        tbody tr:hover td {
            background: #f8fbff;
        }
        tbody tr:last-child td {
            border-bottom: 0;
        }
        .muted { color: var(--muted); }
        .mono {
            font-family: "IBM Plex Mono", monospace;
            font-variant-numeric: tabular-nums;
        }
        .metric-inline {
            display: inline-flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .ticker {
            font-family: "IBM Plex Mono", monospace;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--surface-alt);
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }
        .status-pill--success {
            background: var(--success-soft);
            border-color: rgba(22, 163, 74, 0.18);
            color: #15803d;
        }
        .status-pill--warning {
            background: var(--warn-soft);
            border-color: rgba(217, 119, 6, 0.18);
            color: #b45309;
        }
        .status-pill--danger {
            background: var(--danger-soft);
            border-color: rgba(220, 38, 38, 0.18);
            color: #b91c1c;
        }
        .status-pill--info {
            background: var(--accent-soft);
            border-color: rgba(37, 99, 235, 0.16);
            color: #1d4ed8;
        }
        .section-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .stack { display: grid; gap: 16px; }
        @media (max-width: 1100px) {
            .card--span-3, .card--span-4, .card--span-6, .card--span-8 { grid-column: span 12; }
            .forms-grid { grid-template-columns: 1fr; }
            .action-grid { grid-template-columns: 1fr; }
            .toolbar { gap: 10px; }
        }
        @media (max-width: 760px) {
            .performance-grid {
                grid-template-columns: 1fr;
            }
            .shell {
                padding: 18px 12px 24px;
            }
            .hero {
                flex-direction: column;
                align-items: flex-start;
            }
            .card {
                padding: 14px;
            }
            th, td {
                padding: 9px 10px;
            }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div id="modal-root"></div>
    <div class="shell">
        <div class="hero">
            <div>
                <h1>Fintech Dashboard</h1>
                <p>Портфель, денежные потоки, статусы операций и переоценка в одной светлой рабочей панели без визуального шума.</p>
            </div>
        </div>
        {% block content %}{% endblock %}
    </div>
    <script>
        (() => {
            const closeModal = () => {
                const modalRoot = document.getElementById('modal-root');
                if (modalRoot) {
                    modalRoot.innerHTML = '';
                }
            };

            document.addEventListener('click', (event) => {
                if (event.target.closest('[data-close-modal]')) {
                    closeModal();
                    return;
                }
                if (event.target.matches('[data-modal-backdrop]')) {
                    closeModal();
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeModal();
                }
            });

            document.body.addEventListener('portfolio:close-modal', () => {
                closeModal();
            });
        })();
    </script>
</body>
</html>
