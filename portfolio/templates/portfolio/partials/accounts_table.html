<div class="table-wrap">
<table>
    <thead>
        <tr>
            <th>Счет</th>
            <th>Валюта</th>
            <th>Баланс</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for row in account_rows %}
        <tr>
            <td>
                <strong>{{ row.account.name }}</strong><br>
                <span class="muted">{{ row.account.description|default:'-' }}</span>
            </td>
            <td class="ticker">{{ row.account.currency }}</td>
            <td class="mono">{{ row.ledger_balance|floatformat:2 }}</td>
            <td>
                <div class="button-group">
                <button
                    class="btn btn--ghost"
                    hx-get="{% url 'portfolio:account-edit-form' row.account.id %}"
                    hx-target="#modal-root"
                    hx-swap="innerHTML"
                    type="button"
                >
                    Редактировать
                </button>
                <button
                    class="btn btn--ghost"
                    hx-get="{% url 'portfolio:account-topup-account-form' row.account.id %}"
                    hx-target="#modal-root"
                    hx-swap="innerHTML"
                    type="button"
                >
                    Пополнить
                </button>
                <button
                    class="btn btn--ghost"
                    hx-get="{% url 'portfolio:account-transfer-form' row.account.id %}"
                    hx-target="#modal-root"
                    hx-swap="innerHTML"
                    type="button"
                >
                    Перевод
                </button>
                <form hx-post="{% url 'portfolio:account-delete' row.account.id %}" hx-target="#dashboard-content" hx-swap="innerHTML" hx-confirm="Удалить счет {{ row.account.name }}?" style="display:inline-block; margin-left:8px;">
                    {% csrf_token %}
                    <button class="btn btn--danger" type="submit">Удалить</button>
                </form>
                </div>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="muted">Счета еще не созданы.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
