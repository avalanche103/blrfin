<div class="table-wrap">
<table>
    <thead>
        <tr>
            <th>Дата</th>
            <th>Продукт</th>
            <th>Тип</th>
            <th>Ожидаемая сумма</th>
        </tr>
    </thead>
    <tbody>
        {% for item in upcoming_operations %}
        <tr>
            <td>{{ item.date|date:'d.m.Y' }}</td>
            <td>
                <strong class="ticker">{{ item.asset.symbol }}</strong>
                <div class="muted">{{ item.asset.name }}</div>
            </td>
            <td>
                <span class="status-pill {% if item.type == 'closing' %}status-pill--warning{% elif item.type == 'payout' or item.type == 'capitalization' %}status-pill--info{% endif %}">{{ item.type_label }}</span>
            </td>
            <td class="mono">{{ item.expected_amount|floatformat:2 }} {{ item.currency }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="muted">Планируемых операций пока нет.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
